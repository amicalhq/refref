name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: 10.23.0
  DATABASE_URL: "postgresql://placeholder"
  BETTER_AUTH_SECRET: "ci-only-placeholder-secret-not-for-production-0123456789"
  SKIP_ENV_VALIDATION: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: refref_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter=@refref/webapp^... --filter=@refref/api... --filter=@refref/refer... --filter=@refref/better-auth

      - name: Initialize disposable authentication database
        run: pnpm --filter @refref/coredb exec drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/refref_auth_test

      - name: Type Check
        run: pnpm type:check

      - name: Build webapp
        run: pnpm --filter @refref/webapp build
        env:
          SKIP_ENV_VALIDATION: ""

      - name: Run Tests
        run: pnpm exec turbo run test --filter=!@refref/e2e
        env:
          SKIP_ENV_VALIDATION: "true"
          AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/refref_auth_test

      - name: Verify API key ownership against PostgreSQL
        run: pnpm --filter @refref/api exec vitest run test/integration/postgres-auth.test.ts
        env:
          API_AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/refref_auth_test
